aid: epsor
name: Epsor
description: >-
  Epsor is a French fintech, founded in 2017, that manages employee savings and
  retirement plans (épargne salariale et retraite) for companies and helps them turn
  that benefit into an HR lever. A certified B Corp and mission-driven company, Epsor
  ranks among the top 10 employee-savings and retirement providers in France and serves
  more than 2,500 corporate clients. It targets HR, Compensation & Benefits, and Finance
  teams at mid-size and large French firms, combining a pedagogical, personalized saver
  experience, an open-architecture fund range (40+ funds from 15+ asset managers, with a
  strong ESG/SRI focus), and year-round support to run and promote the plan. Epsor is
  neither an asset manager nor a bank: it is the single point of contact for companies
  and their employees, and delegates account-keeping to Société Générale Securities
  Services (SGSS). Products span PEE, PER Collectif (PERECO), PER Obligatoire,
  intéressement, participation, abondement, and employee share ownership. Epsor exposes
  no public developer API; this profile captures its public identity and security
  posture for the API Evangelist network.
